<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#202739;color:#EDEBEA;font:16px/1.55 'Commissioner',system-ui,sans-serif;padding:24px;
    background-image:linear-gradient(rgba(203,194,193,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(203,194,193,.06) 1px,transparent 1px);background-size:28px 28px}
  main{max-width:640px;text-align:center}
  svg{width:min(360px,80vw);height:auto;color:#FACF82}
  svg path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  p.code{font:500 13px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#FACF82;margin-top:24px}
  h1{font:800 clamp(30px,5vw,48px)/1.05 'Commissioner',sans-serif;letter-spacing:-.02em;margin-top:12px}
  p.t{color:rgba(237,235,234,.76);margin-top:14px}
  a{display:inline-block;margin-top:26px;background:#91413C;color:#FBF3EE;text-decoration:none;font-weight:600;padding:15px 26px;border-radius:6px}
  a:hover{filter:brightness(1.15)}
  @media (prefers-reduced-motion:reduce){svg path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 240 150" aria-hidden="true"><path pathLength="1" d="M20 130h200M40 130V50h160v80M40 50l20-26h120l20 26M100 130V86h40v44M60 66h28v22H60ZM152 66h28v22h-28ZM132 108h2"/></svg>
